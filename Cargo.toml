[workspace]
resolver = "2"
members = [
    "crates/scrooge-proto",
    "crates/scrooge-common",
    "crates/scrooge-classifier",
    "crates/scrooge-policy",
    "crates/scrooge-syslog",
    "crates/scrooge-agent-core",
    "crates/scrooge-agent-linux",
    "crates/scrooge-agent-macos",
    "crates/scrooge-agent-windows",
    "crates/scrooge-agent-bin",
    "crates/scrooge-manager-core",
    "crates/scrooge-manager-api",
    "crates/scrooge-manager-bin",
    "crates/scrooge-cli",
]

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.75"
license       = "GPL-2.0-only"
authors       = ["SQTX <sssqtx@gmail.com>"]
repository    = "https://github.com/SQTX/Scrooge-DLP"
homepage      = "https://github.com/SQTX/Scrooge-DLP"

# ──────────────────────────────────────────────────────────────────────────────
# Wspólne zależności - pinujemy wersje centralnie, crates używają
# `<dep>.workspace = true` zamiast podawać wersje per-crate.
# ──────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
# Async runtime
tokio        = { version = "1.40", features = ["full"] }
tokio-util   = { version = "0.7",  features = ["codec"] }
tokio-stream = { version = "0.1",  features = ["sync"] }
futures      = "0.3"
async-trait  = "0.1"

# gRPC + protobuf
tonic       = { version = "0.12", features = ["tls", "tls-roots"] }
tonic-build = "0.12"
prost       = "0.13"
prost-types = "0.13"

# HTTP / REST
axum           = { version = "0.7", features = ["ws", "macros"] }
tower          = "0.5"
tower-http     = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
hyper          = "1"
http           = "1"
http-body-util = "0.1"

# OpenAPI
utoipa            = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# Serializacja
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_with = "3"

# Bazy danych
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "sqlite",
    "uuid",
    "chrono",
    "json",
    "macros",   # wymagane przez `sqlx::migrate!` i `sqlx::query!` macros
    "migrate",
] }

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender   = "0.2"

# TLS / Crypto
rustls         = "0.23"
rustls-pemfile = "2"
tokio-rustls   = "0.26"
ring           = "0.17"
# `x509-parser` feature włącza `CertificateParams::from_ca_cert_pem` i
# `CertificateSigningRequestParams::from_pem` (potrzebne do loadowania CA
# i signowania CSR-ów; default rcgen ma tylko `pem`, `ring`, `crypto`).
rcgen          = { version = "0.13", features = ["x509-parser"] }
sha2           = "0.10"
hmac           = "0.12"
aes-gcm        = "0.10"

# Auth
bcrypt       = "0.16"
jsonwebtoken = "9"

# Error handling
anyhow    = "1"
thiserror = "2"

# Utility
uuid        = { version = "1",   features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
regex       = "1"
bytes       = "1"
rand        = "0.8"
clap        = { version = "4",   features = ["derive", "env"] }
once_cell   = "1"
parking_lot = "0.12"

# DLP-specific (agent moduły, używane przez crates platformowe)
notify   = "6"
arboard  = "3"
hostname = "0.4"
os_info  = { version = "3", default-features = false }

# Test utilities (dev-dependencies)
tempfile = "3"

# ──────────────────────────────────────────────────────────────────────────────
# Workspace-wide lints. Edition 2021 + clippy pedantic, deny unsafe domyślnie.
# Crates mogą lokalnie #![allow(...)] uzasadnione wyjątki.
# ──────────────────────────────────────────────────────────────────────────────
[workspace.lints.rust]
unsafe_code                   = "deny"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Powszechne wyjątki - clippy::pedantic ma kilka false-positive-prone reguł:
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
# doc_markdown wymaga backtików wokół każdej technicznej nazwy własnej
# (ScroogeDLP, IOKit, PostgreSQL, REST, JSON, ...) - dla naszych doc-comments
# (PL + dużo akronimów) to za dużo szumu.
doc_markdown            = "allow"

# ──────────────────────────────────────────────────────────────────────────────
# Profile - release zoptymalizowany, dev z debuginfo
# ──────────────────────────────────────────────────────────────────────────────
[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = 3

[profile.dev]
opt-level = 0
debug     = true
