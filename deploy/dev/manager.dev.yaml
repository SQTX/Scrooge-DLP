# Dev config for `scrooge-manager`. Used by `make dev-manager`.
#
# Wszystkie ścieżki są relatywne do workspace root (gdzie odpalasz `make`).

server:
  grpc_listen_addr: "127.0.0.1:5443"
  rest_listen_addr: "127.0.0.1:55000"
  tls_cert_path:    "dev-certs/server.pem"
  tls_key_path:     "dev-certs/server.key"
  ca_cert_path:     "dev-certs/ca.pem"
  ca_key_path:      "dev-certs/ca.key"
  # Publiczne adresy + tag releasu dla install API (Sub-faza 1B). W dev
  # wskazuja loopback. Tag z GitHub Releases musi miec .deb/.rpm assets.
  public_grpc_endpoint: "127.0.0.1:5443"
  public_rest_base_url: "http://127.0.0.1:55000"
  agent_release_tag:    "v0.1.0-rc5"

database:
  url:      "postgres://scrooge:scrooge-dev-password@localhost:5433/scrooge"
  pool_max: 8

# Domyślnie wyłączony zgodnie z briefem. Dla testów Wazuh - włącz tutaj.
syslog_forwarder:
  enabled: false

auth:
  # 64 znaki = 256 bitów. ZMIEŃ przed wyjściem na produkcję.
  jwt_secret:               "dev-only-jwt-secret-DO-NOT-USE-IN-PRODUCTION-32chars-min!!"
  access_token_ttl_secs:    3600
  refresh_token_ttl_secs:   2592000  # 30 dni

# Preferencje dashboardu - serwowane przez GET /api/v1/dashboard/config.
# Default: hard logout po godzinie (compliance-friendly).
dashboard:
  auto_refresh:
    enabled:        true
    interval_secs:  10
    # always      = refresh nawet jeśli user nieaktywny (zawsze świeże dane)
    # active_only = refresh tylko gdy user aktywny (oszczędność CPU)
    # off         = tylko manual Refresh button
    mode:           "active_only"
  session:
    idle_timeout_secs:     3600    # 1h bezczynności = logout (0 = wyłączone)
    absolute_timeout_secs: 3600    # 1h hard limit niezależnie od aktywności
    warn_before_secs:      60      # toast "Session ending in 60s"
    extend_on_activity:    false   # aktywność NIE przedłuża sesji
