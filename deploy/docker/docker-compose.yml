# ScroogeDLP - production-like docker-compose.
#
# Uruchom przez `deploy/quickstart.sh` (interaktywny bootstrap) lub
# ręcznie: `docker compose -f deploy/docker/docker-compose.yml up -d`.
#
# Env vars (zwykle przez `.env` obok tego pliku):
#   POSTGRES_USER        (default: scrooge)
#   POSTGRES_PASSWORD    (REQUIRED — quickstart generuje)
#   POSTGRES_DB          (default: scrooge)
#   MANAGER_GRPC_PORT    (default: 5443)
#   MANAGER_REST_PORT    (default: 55000)

services:
  postgres:
    image: postgres:16-alpine
    container_name: scrooge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-scrooge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB:       ${POSTGRES_DB:-scrooge}
    volumes:
      - scrooge-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrooge} -d ${POSTGRES_DB:-scrooge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scrooge

  manager:
    image: scrooge-manager:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.manager
    container_name: scrooge-manager
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MANAGER_GRPC_PORT:-5443}:5443"
      - "${MANAGER_REST_PORT:-55000}:55000"
    volumes:
      # Config + certy — montowane read-only z hosta.
      - ./manager.yaml:/etc/scrooge/manager.yaml:ro
      - ./certs:/var/lib/scrooge/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/55000 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scrooge

volumes:
  scrooge-pg-data:

networks:
  scrooge:
    driver: bridge
